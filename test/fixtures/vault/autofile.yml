version: 1

strict: true
filename_pattern: '[a-z][a-z-]*'

folders:
  - path: archive
    description: Stored documents.
    extensions: [pdf]
  - path: archive/images
    description: Stored images.
    extensions: [png]
  - path: contacts
    description: Structured contacts.
    extensions: [md]
    filename_pattern: '[a-z]+'
    schema:
      type: object
      required: [title]
      properties:
        title: { type: string }
    body: none
  - path: missing
    description: A deliberately absent folder.
