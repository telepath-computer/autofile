paths:
  /archive:
    description: Stored documents.
    extensions: [pdf]
  /contacts:
    description: Structured contacts.
    extensions: [md]
    filenames:
      pattern: '[a-z][a-z-]*'
    schema:
      type: object
      required: [title]
      properties:
        title: { type: string }
    body:
      allowed: false
    internal_links:
      format: wikilink
  /missing:
    description: A deliberately absent scope.
