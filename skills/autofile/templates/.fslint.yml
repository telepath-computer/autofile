ignore:
  - "VAULT.md"
  - "_*/**"
  - "**/_*/**"

scopes:
  # No untyped markdown records at vault root; root markdown is limited to ignored VAULT.md.
  - where:
      path: "*.md"
    rules:
      - id: no-root-markdown-records
        type: frontmatter
        additional_properties: false
        properties: {}

  - where:
      path: "references/*.md"
    rules:
      - id: reference-frontmatter
        type: frontmatter
        additional_properties: false
        properties:
          <<: &global_properties
            related:
              type: array
              items:
                type: string
          title:
            type: string
            required: true
          type:
            type: string
            enum: [article, book, video, paper, website, post, dataset]
          url:
            type: string
          author:
            type: array
            items:
              type: string
          date: &date
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          publisher:
            type: string
          asset_path:
            type: string

  - where:
      path: "contacts/*.md"
    rules:
      - id: contact-frontmatter
        type: frontmatter
        additional_properties: false
        properties:
          <<: *global_properties
          name:
            type: string
            required: true
          type:
            type: string
            enum: [person, organization]
            required: true
          aliases:
            type: array
            items:
              type: string
          email:
            type: string
          phone:
            type: string
          website:
            type: string

  - where:
      path: "places/*.md"
    rules:
      - id: place-frontmatter
        type: frontmatter
        additional_properties: false
        properties:
          <<: *global_properties
          name:
            type: string
            required: true
          type:
            type: string
            enum: [region, restaurant, bar, cafe, shop, point-of-interest]
            required: true
          parent:
            type: string
          address:
            type: string
          gps:
            type: array
            items:
              type: number
          website:
            type: string

  - where:
      path: "events/*.md"
    rules:
      - id: event-frontmatter
        type: frontmatter
        additional_properties: false
        properties:
          <<: *global_properties
          title:
            type: string
            required: true
          date:
            <<: *date
            required: true
          participants:
            type: array
            items:
              type: string
          location:
            type: string

  - where:
      path: "context/*.md"
    rules:
      - id: context-frontmatter
        type: frontmatter
        additional_properties: false
        properties:
          <<: *global_properties
          title:
            type: string
          url:
            type: string
          asset_path:
            type: string
